<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-size:16px;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;overflow:auto;"><h1>Global Crash:</h1><pre style="white-space:pre-wrap;">' + (event.error ? event.error.stack : event.message) + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
<script>window.addEventListener("unhandledrejection", e => { document.body.innerHTML += `<div style="background:orange;color:black;padding:20px;position:fixed;top:0;left:0;z-index:9999;">Unhandled Promise: ${e.reason}</div>`; });</script>
